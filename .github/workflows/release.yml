name: Release

# The tag is the single trigger. Every release has a tag, and creating a release
# in the UI creates that tag, which fires this same push event. A 'release'
# trigger would therefore only ever duplicate the run and get cancelled.
# To release from a tag that predates this workflow, use workflow_dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the firmware to"
        required: true

permissions:
  contents: write

# Re-tagging supersedes an in-flight run for the same tag. Safe: the job is
# idempotent, creating the release if absent and updating it if present.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade https://github.com/pioarduino/platformio-core/archive/487a894a713d36acbd9d858267076d0ab957d543.zip

      - name: Build firmware
        run: pio run -e seeed_indicator_rp2040

      - name: Bundle release archive
        id: bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="indicator_rp2040-${VERSION}"
          build=.pio/build/seeed_indicator_rp2040
          mkdir -p "dist/${name}"
          cp "${build}/firmware.uf2" "dist/${name}/${name}.uf2"
          cp "${build}/firmware.elf" "dist/${name}/${name}.elf"
          cp "${build}/firmware.bin" "dist/${name}/${name}.bin"
          cp LICENSE README.md "dist/${name}/"
          (cd dist && zip -r "${name}.zip" "${name}")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: dist/${{ steps.bundle.outputs.name }}.zip
          if-no-files-found: error

      # Creating a release in the UI also creates its tag, so this run may be
      # attaching assets to a release that already has notes someone wrote.
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Only author notes when this run is what creates the release,
          # so existing notes are never overwritten.
          generate_release_notes: ${{ steps.existing.outputs.found == 'false' }}
          draft: false
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.bundle.outputs.name }}.zip
            .pio/build/seeed_indicator_rp2040/firmware.uf2
